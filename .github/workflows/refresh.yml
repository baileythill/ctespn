name: Refresh data and deploy

on:
  schedule:
    - cron: "0 13 * * 2" # Tuesdays 8am ET: the week is locked, the sob stories are ready
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh ESPN data (scheduled/manual runs)
        if: github.event_name != 'push'
        run: |
          pip install requests
          python fetch_espn.py
          python metrics.py
          python export_web.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "ctespn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data web/public/data
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push

      - name: Rebuild export on push (data already committed)
        if: github.event_name == 'push'
        run: |
          pip install requests
          python export_web.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        env:
          GHPAGES_BASE: /ctespn/
        run: |
          cd web
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
